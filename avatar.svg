<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150" style="background: transparent;">
    <defs>
        <!-- Background Radial Glow -->
        <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
        </radialGradient>
        <!-- Ring Linear Gradient -->
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <filter id="avatarDropShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.25"/>
        </filter>
    </defs>

    <style>
        /* Rotating Ring Animation */
        @keyframes rotateRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Pulse Avatar Glow */
        @keyframes pulseGlow {
            0% { opacity: 0.6; transform: scale(0.95); }
            50% { opacity: 0.9; transform: scale(1.02); }
            100% { opacity: 0.6; transform: scale(0.95); }
        }
        /* Floating developer silhouette */
        @keyframes floatDev {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        .orbit-ring {
            transform-origin: 75px 75px;
            animation: rotateRing 12s linear infinite;
        }
        .glow-circle {
            transform-origin: 75px 75px;
            animation: pulseGlow 4s ease-in-out infinite;
        }
        .developer-shapes {
            animation: floatDev 4s ease-in-out infinite;
            transform-origin: 75px 100px;
        }
    </style>

    <!-- Background Glow -->
    <circle cx="75" cy="75" r="70" fill="url(#avatarGlow)" class="glow-circle" />

    <!-- Rotating Outer Ring -->
    <circle cx="75" cy="75" r="62" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="200 40 40 40" class="orbit-ring" filter="url(#avatarDropShadow)" />
    
    <!-- Inner Base Circle -->
    <circle cx="75" cy="75" r="54" fill="#0f172a" stroke="#1f2937" stroke-width="2" />

    <!-- Developer Silhouette / Illustration -->
    <g class="developer-shapes">
        <!-- Developer Head -->
        <circle cx="75" cy="56" r="14" fill="#3b82f6" opacity="0.85" />
        <!-- Hair / Cap -->
        <path d="M60 54 C60 40 90 40 90 54 Z" fill="#1d4ed8" />
        
        <!-- Smart Glasses -->
        <rect x="64" y="52" width="10" height="6" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5" />
        <rect x="76" y="52" width="10" height="6" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.5" />
        <line x1="74" y1="55" x2="76" y2="55" stroke="#60a5fa" stroke-width="1.5" />

        <!-- Shoulders / Body -->
        <path d="M42 96 C42 80 50 74 75 74 C100 74 108 80 108 96 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        
        <!-- Laptop Base -->
        <path d="M52 108 L98 108 L104 114 L46 114 Z" fill="#334155" />
        <!-- Glowing Screen -->
        <path d="M56 108 L94 108 L90 92 L60 92 Z" fill="#60a5fa" opacity="0.75" />
        <!-- Code lines on screen -->
        <line x1="64" y1="96" x2="80" y2="96" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
        <line x1="62" y1="100" x2="74" y2="100" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
        <line x1="66" y1="104" x2="86" y2="104" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
    </g>
</svg>
