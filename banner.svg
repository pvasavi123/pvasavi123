<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220" style="background: #0b0f19; border-radius: 12px; font-family: 'Inter', system-ui, sans-serif;">
    <defs>
        <!-- Gradients -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#581c87" stop-opacity="0.8"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        /* CSS Animations */
        @keyframes floatY {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes floatReverse {
            0% { transform: translateY(0px); }
            50% { transform: translateY(8px); }
            100% { transform: translateY(0px); }
        }
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink {
            50% { border-color: transparent; }
        }
        @keyframes glowPulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

        .title-text {
            font-size: 32px;
            font-weight: 800;
            fill: url(#textGrad);
            letter-spacing: 2px;
        }
        .code-accent {
            font-family: 'Fira Code', monospace;
            fill: #3b82f6;
            font-size: 24px;
            font-weight: bold;
        }
        .subtitle-text {
            font-size: 16px;
            fill: #9ca3af;
            font-weight: 500;
        }

        /* Floating elements classes */
        .float-node-1 {
            animation: floatY 5s ease-in-out infinite;
        }
        .float-node-2 {
            animation: floatReverse 6s ease-in-out infinite;
        }
        .float-node-3 {
            animation: floatY 4s ease-in-out infinite;
        }
        
        .badge-bg {
            fill: #111827;
            stroke: #1f2937;
            stroke-width: 1px;
            rx: 8px;
        }
        .badge-text {
            font-size: 11px;
            font-weight: 600;
            fill: #f3f4f6;
        }
    </style>

    <!-- Animated border glow -->
    <rect x="2" y="2" width="796" height="216" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="3" />
    <rect x="2" y="2" width="796" height="216" rx="12" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4" style="animation: glowPulse 4s infinite;" filter="url(#glow)" />

    <!-- Left visual elements - Coding bracket visual -->
    <text x="50" y="125" class="code-accent">&lt;</text>
    <text x="730" y="125" class="code-accent">/&gt;</text>

    <!-- Center Content -->
    <g transform="translate(400, 105)" text-anchor="middle">
        <text y="-25" class="title-text">VASAVI VARMA</text>
        <text y="15" class="subtitle-text">Full Stack Developer | Java &amp; Spring Boot | React | Django</text>
        <text y="45" font-size="12" fill="#6b7280" font-weight="600" letter-spacing="1">BUILD. LEARN. IMPROVE. REPEAT.</text>
    </g>

    <!-- Floating badget nodes (decorations) -->
    <!-- Node 1: Java (Top Left) -->
    <g class="float-node-1" transform="translate(100, 45)">
        <rect class="badge-bg" width="65" height="28" rx="6"/>
        <text x="32" y="18" text-anchor="middle" class="badge-text" fill="#f59e0b">Java ☕</text>
    </g>

    <!-- Node 2: React (Bottom Left) -->
    <g class="float-node-2" transform="translate(140, 140)">
        <rect class="badge-bg" width="75" height="28" rx="6"/>
        <text x="37" y="18" text-anchor="middle" class="badge-text" fill="#06b6d4">React ⚛️</text>
    </g>

    <!-- Node 3: Spring Boot (Top Right) -->
    <g class="float-node-3" transform="translate(630, 45)">
        <rect class="badge-bg" width="90" height="28" rx="6"/>
        <text x="45" y="18" text-anchor="middle" class="badge-text" fill="#10b981">Spring Boot 🍃</text>
    </g>

    <!-- Node 4: Django (Bottom Right) -->
    <g class="float-node-2" transform="translate(590, 140)">
        <rect class="badge-bg" width="80" height="28" rx="6"/>
        <text x="40" y="18" text-anchor="middle" class="badge-text" fill="#047857">Django 🐍</text>
    </g>
</svg>
